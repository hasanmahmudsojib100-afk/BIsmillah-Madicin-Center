<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bismillah Madicin Center</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef2f7;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      padding: 20px 16px;
      transition: background 0.3s, color 0.2s;
    }

    body.dark {
      background: #121826;
      color: #e2e8f0;
    }

    .container {
      max-width: 550px;
      margin: 0 auto;
      background: white;
      border-radius: 40px;
      padding: 20px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      transition: background 0.3s;
    }

    body.dark .container {
      background: #1e293b;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    /* Menu tabs */
    .menu-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 8px;
    }
    body.dark .menu-tabs {
      border-bottom-color: #475569;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 10px 0;
      cursor: pointer;
      border-radius: 30px;
      transition: 0.2s;
      color: #1e293b;
    }
    body.dark .tab-btn {
      color: #cbd5e1;
    }
    .tab-btn.active {
      background: #3b82f6;
      color: white;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active-pane {
      display: block;
    }

    /* Dark mode toggle button */
    .dark-toggle {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .dark-toggle button {
      background: #334155;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    body.dark .dark-toggle button {
      background: #facc15;
      color: #1e293b;
    }

    /* form elements */
    label {
      font-weight: 600;
      font-size: 0.85rem;
      display: block;
      margin-top: 14px;
      margin-bottom: 4px;
    }
    select, input, button {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border-radius: 28px;
      border: 1px solid #cbd5e1;
      background: white;
      transition: 0.2s;
    }
    body.dark select, body.dark input, body.dark button {
      background: #0f172a;
      border-color: #475569;
      color: #f1f5f9;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .row {
      display: flex;
      gap: 12px;
      margin: 14px 0 12px;
    }
    .row button {
      flex: 1;
      font-weight: 700;
      font-size: 1.2rem;
      border: none;
      cursor: pointer;
    }
    .btn-income { background: #10b981; color: white; }
    .btn-expense { background: #ef4444; color: white; }
    .btn-primary { background: #3b82f6; color: white; border: none; font-weight: 600; cursor: pointer; margin: 8px 0 6px; }
    .btn-print { background: #8b5cf6; color: white; border: none; margin-top: 10px; }
    .card {
      background: #f8fafc;
      border-radius: 28px;
      padding: 16px 18px;
      margin-top: 20px;
      border: 1px solid #e2e8f0;
    }
    body.dark .card {
      background: #0f172a;
      border-color: #334155;
    }
    .balance-card {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }
    body.dark .balance-card {
      background: linear-gradient(135deg, #020617, #0f172a);
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    .stat-box {
      flex: 1;
      background: white;
      border-radius: 20px;
      padding: 8px 5px;
      text-align: center;
    }
    body.dark .stat-box {
      background: #1e293b;
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #475569;
    }
    body.dark .stat-label {
      color: #94a3b8;
    }
    .stat-value {
      font-weight: 800;
      font-size: 1.3rem;
      color: #0f172a;
    }
    body.dark .stat-value {
      color: #f1f5f9;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0 10px;
    }
    .list {
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #eef2ff;
      overflow: hidden;
      margin-bottom: 20px;
    }
    body.dark .list {
      background: #0f172a;
      border-color: #334155;
    }
    .transaction-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #eef2ff;
    }
    body.dark .transaction-item {
      border-bottom-color: #334155;
    }
    .purpose-amount-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 10px;
      background: #fefce8;
      padding: 4px 12px;
      border-radius: 40px;
    }
    body.dark .purpose-amount-row {
      background: #334155;
    }
    .purpose-badge {
      background: #eef2ff;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    body.dark .purpose-badge {
      background: #475569;
      color: white;
    }
    .optional-number, .date-time-chip {
      font-size: 0.7rem;
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 20px;
    }
    body.dark .optional-number, body.dark .date-time-chip {
      background: #334155;
      color: #cbd5e6;
    }
    .edit-btn, .delete-btn {
      border: none;
      background: transparent;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 40px;
      cursor: pointer;
    }
    .edit-btn { background: #e0e7ff; color: #2563eb; }
    .delete-btn { background: #fee2e2; color: #dc2626; }
    body.dark .edit-btn { background: #1e3a8a; color: #93c5fd; }
    body.dark .delete-btn { background: #7f1d1d; color: #fca5a5; }

    /* Chat box styles */
    .chat-messages {
      background: #f8fafc;
      border-radius: 28px;
      padding: 16px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    body.dark .chat-messages {
      background: #0f172a;
      border-color: #334155;
    }
    .message {
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 20px;
      max-width: 85%;
      word-wrap: break-word;
      word-break: break-word;
    }
    .message.sent {
      background: #3b82f6;
      color: white;
      margin-left: auto;
      text-align: right;
    }
    .message.received {
      background: #e2e8f0;
      color: #1e293b;
    }
    body.dark .message.received {
      background: #334155;
      color: #f1f5f9;
    }
    .message small {
      display: block;
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 4px;
    }
    .chat-input-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chat-input-area input {
      flex: 3;
    }
    .chat-input-area button {
      flex: 1;
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
    }
    .chat-input-area button:last-child {
      background: #64748b;
    }
    /* Modal fixes for dark mode */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: white;
      max-width: 450px;
      width: 90%;
      border-radius: 40px;
      padding: 24px 20px;
      animation: fadeUp 0.2s;
      transition: background 0.2s;
    }
    body.dark .modal-card {
      background: #1e293b;
      color: #e2e8f0;
    }
    body.dark .modal-card input,
    body.dark .modal-card select {
      background: #0f172a;
      border-color: #475569;
      color: white;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .modal-actions button {
      flex: 1;
    }
    @media (max-width: 480px) {
      .container { padding: 16px; }
      .purpose-amount-row { flex-wrap: nowrap; overflow-x: auto; }
      .chat-input-area { flex-direction: column; }
      .chat-input-area button { width: 100%; }
    }
    @media print {
      .menu-tabs, .dark-toggle, .row, .filter-bar, .actions, .edit-btn, .delete-btn, .chat-input-area, .btn-primary, .btn-print { display: none !important; }
    }
  </style>
</head>
<body>
<div class="dark-toggle">
  <button id="darkModeToggle"> Dark Mode</button>
</div>

<div class="container">
  <div class="menu-tabs">
    <h2>Bismillah Madicin Center</h2>
    <button class="tab-btn active" data-tab="cash"> Cash Box</button>
    <button class="tab-btn" data-tab="chat"> Chat Box</button>
  </div>

  <!-- Cash Box Pane -->
  <div id="cashPane" class="tab-pane active-pane">
    <div style="text-align: center;"><span class="date" id="currentDate"></span></div>
    <label> Purpose</label>
    <select id="purposeSelect">
      <option value="Cash In">Cash In</option>
      <option value="Cash Out">Cash Out</option>
      <option value="Madicin">Madicin</option>
      <option value="Recarch">Recarch</option>
      <option value="Other"> Other (custom)</option>
    </select>
    <div id="customPurposeContainer" style="display: none; margin-top: 8px;">
      <input type="text" id="customPurposeText" placeholder="Enter custom purpose...">
    </div>
    <label> Amount (BDT)</label>
    <input type="number" id="amount" placeholder="0.00">
    <label> Optional Number</label>
    <input type="number" id="optionalNumber" placeholder="Leave empty">
    <div class="row">
      <button class="btn-income" id="incomeBtn">In </button>
      <button class="btn-expense" id="expenseBtn">Out</button>
    </div>
    <button class="btn-primary" id="addBtn">+ ADD </button>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn-print" id="printBtn"> Print / PDF</button>
      <button class="btn-print" id="shareBtn" style="background:#3b82f6;"> Share Report</button>
    </div>
    <div class="card balance-card"><div> BALANCE</div><span id="balance">0</span> ৳</div>
    <div class="card">
      <div class="stats">
        <div class="stat-box"><div class="stat-label">Total Income</div><div class="stat-value" id="totalIncome">0</div></div>
        <div class="stat-box"><div class="stat-label">Total Expense</div><div class="stat-value" id="totalExpense">0</div></div>
        <div class="stat-box"><div class="stat-label">Madicin</div><div class="stat-value" id="totalMadicin">0</div></div>
        <div class="stat-box"><div class="stat-label">Recarch</div><div class="stat-value" id="totalRecarch">0</div></div>
      </div>
    </div>
    <div class="filter-bar">
      <input type="date" id="filterDate">
      <button id="filterBtn">📅 Show Report</button>
      <button id="showAllBtn">⟳ Show All</button>
    </div>
    <h3>📥 INC HISTORY</h3>
    <div id="incomeList" class="list"></div>
    <h3>📤 out HISTORY</h3>
    <div id="expenseList" class="list"></div>
  </div>

  <!-- Chat Box Pane -->
  <div id="chatPane" class="tab-pane">
    <div style="text-align: center; margin-bottom: 16px;">
      <span class="date"> Personal Chat – messages saved locally</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type your message...">
      <button id="sendChatBtn">Send</button>
      <button id="receiveChatBtn"> Received</button>
    </div>
    <div style="margin-top: 12px;">
      <button id="clearChatBtn" style="background:#ef4444; color:white; border:none;">🗑️ Clear All Messages</button>
    </div>
  </div>
</div>

<!-- Edit Modal (for cash box) -->
<div id="editModal" class="modal">
  <div class="modal-card">
    <h3> Edit Transaction</h3>
    <label>Purpose</label><input type="text" id="editPurpose">
    <label>Amount (৳)</label><input type="number" id="editAmount">
    <label>Optional Number</label><input type="number" id="editOptionalNumber">
    <label>Type</label><select id="editType"><option value="in">Income</option><option value="out">Expense</option></select>
    <label>Date & Time (YYYY-MM-DD HH:MM:SS AM/PM)</label>
    <input type="text" id="editDateTime" placeholder="e.g., 2026-05-01 02:30:45 PM">
    <div class="modal-actions">
      <button id="closeModalBtn">Cancel</button>
      <button id="saveEditBtn">Save</button>
    </div>
  </div>
</div>

<script>
  // -------------------- CASH BOX LOGIC --------------------
  let transactions = [];
  let currentType = "in";
  let editId = null;

  function getCurrentDateTime12Hour() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    const hours12 = String(hours).padStart(2, '0');
    return `${year}-${month}-${day} ${hours12}:${minutes}:${seconds} ${ampm}`;
  }

  // Validate and parse date-time string (strict format)
  function isValidDateTime(dt) {
    const regex = /^\d{4}-\d{2}-\d{2} (0[1-9]|1[0-2]):[0-5]\d:[0-5]\d (AM|PM)$/;
    return regex.test(dt);
  }

  function formatDisplayDateTime(dt) {
    if (!dt) return '';
    const parts = dt.split(' ');
    if (parts.length < 2) return dt;
    const [year, month, day] = parts[0].split('-');
    const time = parts.slice(1).join(' ');
    return `${day}/${month}/${year} ${time}`;
  }

  function getDateOnly(dt) { return dt ? dt.split(' ')[0] : ''; }

  function loadCashData() {
    const stored = localStorage.getItem("cashbox_pro_datetime");
    transactions = stored ? JSON.parse(stored) : [];
  }
  function saveCashData() { localStorage.setItem("cashbox_pro_datetime", JSON.stringify(transactions)); }

  const purposeSelect = document.getElementById('purposeSelect');
  const customContainer = document.getElementById('customPurposeContainer');
  const customInput = document.getElementById('customPurposeText');
  const amountInput = document.getElementById('amount');
  const optionalNumberInput = document.getElementById('optionalNumber');
  const incomeBtn = document.getElementById('incomeBtn');
  const expenseBtn = document.getElementById('expenseBtn');
  const addBtn = document.getElementById('addBtn');
  const filterDateInput = document.getElementById('filterDate');
  const filterBtn = document.getElementById('filterBtn');
  const showAllBtn = document.getElementById('showAllBtn');
  const printBtn = document.getElementById('printBtn');
  const shareBtn = document.getElementById('shareBtn');

  function toggleCustomInput() {
    if (purposeSelect.value === 'Other') customContainer.style.display = 'block';
    else { customContainer.style.display = 'none'; customInput.value = ''; }
  }
  purposeSelect.addEventListener('change', toggleCustomInput);
  toggleCustomInput();

  function getFinalPurpose() {
    return purposeSelect.value === 'Other' ? (customInput.value.trim() || "Other") : purposeSelect.value;
  }

  function addTransaction() {
    let purpose = getFinalPurpose();
    let amount = parseFloat(amountInput.value);
    if (isNaN(amount) || amount <= 0) return alert("Valid positive amount required");
    let optionalNum = optionalNumberInput.value.trim();
    let optionalNumberValue = optionalNum === "" ? null : parseFloat(optionalNum);
    const newTx = {
      id: Date.now() + '-' + Math.random().toString(36).substr(2, 6),
      purpose, amount, type: currentType,
      datetime: getCurrentDateTime12Hour(),
      optionalNumber: optionalNumberValue
    };
    transactions.push(newTx);
    saveCashData();
    renderCash();
    amountInput.value = "";
    optionalNumberInput.value = "";
    if (purposeSelect.value === 'Other') customInput.value = "";
    purposeSelect.value = "Cash In";
    toggleCustomInput();
    currentType = "in";
    highlightTypeButton();
  }

  function deleteTransaction(id) {
    if (!confirm("Delete permanently?")) return;
    transactions = transactions.filter(t => t.id != id);
    saveCashData();
    renderCash();
  }

  function openEditModal(id) {
    const t = transactions.find(tx => tx.id == id);
    if (!t) return;
    editId = id;
    document.getElementById('editPurpose').value = t.purpose;
    document.getElementById('editAmount').value = t.amount;
    document.getElementById('editOptionalNumber').value = t.optionalNumber !== null ? t.optionalNumber : "";
    document.getElementById('editType').value = t.type;
    document.getElementById('editDateTime').value = t.datetime || "";
    document.getElementById('editModal').style.display = 'flex';
  }
  function closeModal() { document.getElementById('editModal').style.display = 'none'; editId = null; }
  function saveEdit() {
    if (!editId) return;
    const newPurpose = document.getElementById('editPurpose').value.trim();
    const newAmount = parseFloat(document.getElementById('editAmount').value);
    const newOptional = document.getElementById('editOptionalNumber').value.trim();
    const optionalVal = newOptional === "" ? null : parseFloat(newOptional);
    const newType = document.getElementById('editType').value;
    let newDateTime = document.getElementById('editDateTime').value.trim();
    if (!newPurpose || isNaN(newAmount) || newAmount <= 0) return alert("Invalid purpose or amount");
    if (!newDateTime) return alert("Date & time required");
    // Validate format
    if (!isValidDateTime(newDateTime)) {
      alert("Invalid format! Use: YYYY-MM-DD HH:MM:SS AM/PM (e.g., 2026-05-01 02:30:45 PM)");
      return;
    }
    const idx = transactions.findIndex(t => t.id == editId);
    if (idx !== -1) {
      transactions[idx] = { ...transactions[idx], purpose: newPurpose, amount: newAmount, optionalNumber: optionalVal, type: newType, datetime: newDateTime };
      saveCashData();
      renderCash();
    }
    closeModal();
  }

  function renderCash() {
    const filtered = filterDateInput.value ? transactions.filter(t => getDateOnly(t.datetime) === filterDateInput.value) : transactions;
    renderFilteredList(filtered);
  }

  function renderFilteredList(txList) {
    const incDiv = document.getElementById('incomeList');
    const expDiv = document.getElementById('expenseList');
    incDiv.innerHTML = ''; expDiv.innerHTML = '';
    let balance = 0, totalInc = 0, totalExp = 0, totalMed = 0, totalRec = 0;
    for (let item of txList) {
      const amt = Number(item.amount);
      if (item.type === 'in') { balance += amt; totalInc += amt; }
      else { balance -= amt; totalExp += amt; }
      const low = item.purpose.toLowerCase();
      if (low === 'madicin') totalMed += amt;
      if (low === 'recarch') totalRec += amt;
      const optionalHtml = (item.optionalNumber !== null && item.optionalNumber !== undefined) ? `<span class="optional-number">🔢 ${item.optionalNumber}</span>` : '';
      const div = document.createElement('div');
      div.className = 'transaction-item';
      div.innerHTML = `
        <div style="display:flex; flex-wrap:wrap; gap:8px; flex:2; align-items:center;">
          <div class="purpose-amount-row"><span class="purpose-badge">${escapeHtml(item.purpose)}</span><span class="amount" style="color:${item.type === 'in' ? '#10b981' : '#ef4444'}">${item.type === 'in' ? '+' : '-'} ${amt.toFixed(2)} ৳</span></div>
          ${optionalHtml}<span class="date-time-chip">📅 ${formatDisplayDateTime(item.datetime)}</span>
        </div>
        <div class="actions"><button class="edit-btn" onclick="openEditModal('${item.id}')">Edit</button><button class="delete-btn" onclick="deleteTransaction('${item.id}')">Delete</button></div>
      `;
      if (item.type === 'in') incDiv.appendChild(div);
      else expDiv.appendChild(div);
    }
    document.getElementById('balance').innerText = balance.toFixed(2);
    document.getElementById('totalIncome').innerText = totalInc.toFixed(2);
    document.getElementById('totalExpense').innerText = totalExp.toFixed(2);
    document.getElementById('totalMadicin').innerText = totalMed.toFixed(2);
    document.getElementById('totalRecarch').innerText = totalRec.toFixed(2);
  }

  function filterByDate() { if (!filterDateInput.value) alert("Pick a date"); else renderCash(); }
  function showAll() { filterDateInput.value = ""; renderCash(); }

  function generateReportHTML() {
    const currentTx = filterDateInput.value ? transactions.filter(t => getDateOnly(t.datetime) === filterDateInput.value) : transactions;
    let balance=0,tInc=0,tExp=0,tMed=0,tRec=0;
    for(let i of currentTx){ let a=Number(i.amount); if(i.type==='in'){balance+=a; tInc+=a;}else{balance-=a; tExp+=a;} let l=i.purpose.toLowerCase(); if(l==='madicin') tMed+=a; if(l==='recarch') tRec+=a; }
    let rows='';
    for(let i of currentTx) rows+=`<tr><td>${i.type==='in'?'Income':'Expense'}</td><td>${escapeHtml(i.purpose)}</td><td style="text-align:right">${i.type==='in'?'+':'-'} ${Number(i.amount).toFixed(2)} ৳</td><td>${i.datetime||''}</td><td>${i.optionalNumber||''}</td></tr>`;
    return `<html><head><title>Cash Report</title><style>body{font-family:Arial;margin:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px}</style></head><body><h1>Cash Box Report</h1><div>Balance: ${balance.toFixed(2)} ৳ | Income: ${tInc} | Expense: ${tExp} | Madicin: ${tMed} | Recarch: ${tRec}</div><table><tr><th>Type</th><th>Purpose</th><th>Amount</th><th>Date & Time</th><th>Optional #</th></tr>${rows||'<tr><td colspan="5">No data</td></tr>'}</table></body></html>`;
  }
  function printReport() { let w=window.open('','_blank'); w.document.write(generateReportHTML()); w.document.close(); w.print(); }
  async function shareReport() { let html=generateReportHTML(); let file=new File([html],"report.html",{type:"text/html"}); if(navigator.share) try{await navigator.share({title:"Cash Report",files:[file]})}catch(e){alert("Share cancelled");} else alert("Share not supported, use Print to PDF"); }

  function highlightTypeButton() { 
    if(currentType==='in') { incomeBtn.style.opacity='1'; expenseBtn.style.opacity='0.7'; } 
    else { expenseBtn.style.opacity='1'; incomeBtn.style.opacity='0.7'; } 
    setTimeout(()=>{incomeBtn.style.opacity='';expenseBtn.style.opacity='';},150); 
  }

  incomeBtn.onclick = () => { currentType='in'; highlightTypeButton(); };
  expenseBtn.onclick = () => { currentType='out'; highlightTypeButton(); };
  addBtn.onclick = addTransaction;
  filterBtn.onclick = filterByDate;
  showAllBtn.onclick = showAll;
  printBtn.onclick = printReport;
  shareBtn.onclick = shareReport;
  document.getElementById('closeModalBtn').onclick = closeModal;
  document.getElementById('saveEditBtn').onclick = saveEdit;
  window.onclick = (e) => { if(e.target === document.getElementById('editModal')) closeModal(); };

  // -------------------- CHAT BOX --------------------
  let chatMessages = [];
  function loadChat() { const stored = localStorage.getItem("personal_chat"); chatMessages = stored ? JSON.parse(stored) : []; renderChat(); }
  function saveChat() { localStorage.setItem("personal_chat", JSON.stringify(chatMessages)); }
  function addMessage(text, isSent=true) { if(!text.trim()) return; const msg = { id: Date.now(), text: text.trim(), isSent, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }; chatMessages.push(msg); saveChat(); renderChat(); }
  function renderChat() { const container = document.getElementById('chatMessages'); if(!container) return; container.innerHTML = ''; for(let msg of chatMessages) { const div = document.createElement('div'); div.className = `message ${msg.isSent ? 'sent' : 'received'}`; div.innerHTML = `<div>${escapeHtml(msg.text)}</div><small>${msg.time}</small>`; container.appendChild(div); } container.scrollTop = container.scrollHeight; }
  function clearChat() { if(confirm("Delete all chat messages?")) { chatMessages = []; saveChat(); renderChat(); } }
  document.getElementById('sendChatBtn')?.addEventListener('click', () => { const input = document.getElementById('chatInput'); if(input.value.trim()) { addMessage(input.value, true); input.value = ''; } });
  document.getElementById('receiveChatBtn')?.addEventListener('click', () => { const input = document.getElementById('chatInput'); if(input.value.trim()) { addMessage(input.value, false); input.value = ''; } else alert("Type a message first"); });
  document.getElementById('clearChatBtn')?.addEventListener('click', clearChat);

  // -------------------- DARK MODE & TABS --------------------
  const darkToggle = document.getElementById('darkModeToggle');
  darkToggle.addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); });
  if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');

  const tabs = document.querySelectorAll('.tab-btn');
  const panes = { cash: document.getElementById('cashPane'), chat: document.getElementById('chatPane') };
  tabs.forEach(btn => { btn.addEventListener('click', () => { const tab = btn.dataset.tab; tabs.forEach(b => b.classList.remove('active')); btn.classList.add('active'); Object.values(panes).forEach(p => p?.classList.remove('active-pane')); if(tab === 'cash') panes.cash.classList.add('active-pane'); else if(tab === 'chat') panes.chat.classList.add('active-pane'); }); });

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  document.getElementById('currentDate').innerText = new Date().toLocaleDateString(undefined, { weekday:'short', year:'numeric', month:'short', day:'numeric' });
  loadCashData(); renderCash(); loadChat(); highlightTypeButton();
</script>
</body>
</html>
